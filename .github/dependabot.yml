version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # マイナー・パッチは 1 つの PR にまとめ、メジャーは個別の PR にする
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # 型は実行環境の Node(package.json の engines)にそろえる。
      # メジャーは Node 自体を上げるときに一緒に上げる
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
